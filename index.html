<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SplitEase</title>
<link rel="stylesheet" href="./src/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans text-slate-900 antialiased lg:h-dvh lg:overflow-y-auto">
<div class="mx-auto max-w-6xl px-4 py-6 sm:px-6 lg:flex lg:h-full lg:min-h-160 lg:flex-col lg:px-8 lg:py-5">
  <header class="flex flex-wrap items-center justify-between gap-3 lg:shrink-0">
    <div class="flex items-center gap-3">
      <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-brand text-lg font-bold text-white">S</div>
      <div>
        <h1 class="text-lg font-bold leading-tight">SplitEase</h1>
        <p class="text-xs text-slate-500">Your group expense calculator</p>
      </div>
    </div>
    <span class="rounded-full bg-indigo-50 px-3 py-1 text-xs font-medium text-brand">All amounts in PKR</span>
  </header>
  <section class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-3 lg:mt-4 lg:shrink-0">
    <div class="rounded-3xl bg-brand p-6 text-white shadow-sm lg:p-4">
      <p class="text-sm text-indigo-200">Total spent</p>
      <p id="statTotal" class="mt-2 text-3xl font-bold tracking-tight sm:text-4xl lg:mt-1 lg:text-3xl">Rs. 0</p>
      <p id="statCount" class="mt-2 text-xs lg:mt-1 text-indigo-200">Across 0 expenses</p>
    </div>
    <div class="rounded-3xl bg-white p-6 shadow-sm ring-1 ring-slate-100 lg:p-4">
      <p class="text-sm text-slate-500">Per person</p>
      <p id="statPer" class="mt-2 text-3xl font-bold tracking-tight sm:text-4xl lg:mt-1 lg:text-3xl">Rs. 0</p>
      <p id="statSplit" class="mt-2 text-xs lg:mt-1 text-slate-400">Equal split among 0</p>
    </div>
    <div class="rounded-3xl bg-white p-6 shadow-sm ring-1 ring-slate-100 lg:p-4">
      <p class="text-sm text-slate-500">Members</p>
      <p id="statMembers" class="mt-2 text-3xl font-bold tracking-tight sm:text-4xl lg:mt-1 lg:text-3xl">0</p>
      <p class="mt-2 text-xs lg:mt-1 text-slate-400">In the group</p>
    </div>
  </section>
  <main class="mt-6 grid grid-cols-1 gap-6 lg:mt-4 lg:min-h-0 lg:flex-1 lg:grid-cols-5 lg:grid-rows-1 lg:gap-4">
    <section class="rounded-3xl bg-white p-5 shadow-sm ring-1 ring-slate-100 sm:p-6 lg:col-span-2 lg:flex lg:min-h-0 lg:flex-col">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-semibold">Members</h2>
        <span id="memberBadge" class="rounded-full bg-indigo-50 px-2.5 py-0.5 text-xs font-semibold text-brand">0</span>
      </div>
      <div class="mt-4 flex gap-2">
        <input id="memberName" type="text" placeholder="Enter a name..." class="min-w-0 flex-1 rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm placeholder:text-slate-400 focus:border-brand focus:outline-none focus:ring-2 focus:ring-indigo-200">
        <button id="addMember" class="rounded-xl bg-brand px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-brand-dark focus:outline-none focus:ring-2 focus:ring-indigo-300">Add</button>
      </div>
      <ul id="memberList" class="mt-4 space-y-3 lg:min-h-0 lg:flex-1 lg:overflow-y-auto lg:pr-1"></ul>
    </section>
    <div class="flex flex-col gap-6 lg:col-span-3 lg:min-h-0 lg:gap-4">
      <section class="rounded-3xl bg-white p-5 shadow-sm ring-1 ring-slate-100 sm:p-6 lg:shrink-0">
        <h2 class="text-base font-semibold">Add expense</h2>
        <div class="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-3">
          <label class="sm:col-span-2">
            <span class="text-xs font-medium text-slate-500">Description</span>
            <input id="expDesc" type="text" placeholder="e.g. Lunch" class="mt-1.5 w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm placeholder:text-slate-400 focus:border-brand focus:outline-none focus:ring-2 focus:ring-indigo-200">
          </label>
          <label>
            <span class="text-xs font-medium text-slate-500">Amount</span>
            <div class="mt-1.5 flex items-center rounded-xl border border-slate-200 px-3.5 focus-within:border-brand focus-within:ring-2 focus-within:ring-indigo-200">
              <span class="text-xs font-semibold text-slate-500">PKR</span>
              <input id="expAmount" type="number" min="0" step="any" inputmode="decimal" placeholder="0" class="w-full min-w-0 bg-transparent py-2.5 pl-2 text-sm placeholder:text-slate-400 focus:outline-none">
            </div>
          </label>
          <label class="sm:col-span-2">
            <span class="text-xs font-medium text-slate-500">Paid by</span>
            <select id="expPayer" class="mt-1.5 w-full rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 text-sm focus:border-brand focus:outline-none focus:ring-2 focus:ring-indigo-200"></select>
          </label>
          <div class="flex items-end">
            <button id="addExpense" class="w-full rounded-xl bg-brand px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-brand-dark focus:outline-none focus:ring-2 focus:ring-indigo-300">Add expense</button>
          </div>
        </div>
        <p id="formError" class="mt-3 hidden text-sm text-rose-600"></p>
      </section>
      <section class="rounded-3xl bg-white p-5 shadow-sm ring-1 ring-slate-100 sm:p-6 lg:flex lg:min-h-0 lg:flex-1 lg:flex-col">
        <div class="flex items-center justify-between">
          <h2 class="text-base font-semibold">Expenses</h2>
          <span id="expBadge" class="rounded-full bg-indigo-50 px-2.5 py-0.5 text-xs font-semibold text-brand">0</span>
        </div>
        <ul id="expList" class="mt-4 space-y-3 lg:min-h-0 lg:flex-1 lg:overflow-y-auto lg:pr-1"></ul>
        <div class="mt-5 flex items-center justify-between px-1 lg:mt-3 lg:shrink-0">
          <span class="text-sm text-slate-500">Total</span>
          <span id="expTotal" class="text-xl font-bold">Rs. 0</span>
        </div>
      </section>
    </div>
  </main>
</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
